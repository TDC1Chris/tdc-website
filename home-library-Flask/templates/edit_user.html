<!DOCTYPE html>
<html>
<head>
    <title>Edit User</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input[type="text"], input[type="email"], input[type="tel"] { 
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; 
        }
        .button { display: inline-block; padding: 10px 20px; background-color: #28a745; color: white; text-decoration: none; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        .button:hover { background-color: #218838; }
        .button.back { background-color: #6c757d; }
        .button.back:hover { background-color: #545b62; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>Edit User</h1>
    
    <form method="POST">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" value="{{ user.username }}" required>
        </div>
        
        <div class="form-group">
            <label for="personal_name">Personal Name:</label>
            <input type="text" id="personal_name" name="personal_name" value="{{ user.personal_name }}" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ user.email }}" required>
        </div>
        
        <div class="form-group">
            <label for="phone_number">Phone Number:</label>
            <input type="tel" id="phone_number" name="phone_number" value="{{ user.phone_number or '' }}">
        </div>
        
        <button type="submit" class="button">Update User</button>
        <a href="{{ url_for('users') }}" class="button back">Cancel</a>
    </form>
</body>
</html>
