{% extends 'base.html' %}

{% block title %}Add Book{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row mb-4">
        <div class="col-12">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{{ url_for('reading_dashboard') }}" class="text-success">My Library</a></li>
                    <li class="breadcrumb-item active">Add Book</li>
                </ol>
            </nav>
            <h1 class="page-title text-success">
                <i class="fas fa-plus-circle me-2"></i>Add a Book
            </h1>
            <p class="lead text-muted">Add a book to your reading list</p>
            {% if demo_mode %}
                <span class="badge bg-warning text-dark">
                    <i class="fas fa-flask me-1"></i> Demo Mode - Changes are temporary
                </span>
            {% endif %}
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="tdc-card">
                <form method="POST" action="{{ url_for('add_to_reading_list') }}">
                    <!-- Book Source Selection -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">
                            <i class="fas fa-book me-1 text-success"></i> Book Source
                        </label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="book_source" id="source_library" value="library" checked onchange="toggleBookSource()">
                                <label class="form-check-label" for="source_library">
                                    From Library
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="book_source" id="source_custom" value="custom" onchange="toggleBookSource()">
                                <label class="form-check-label" for="source_custom">
                                    Custom Entry
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Library Book Dropdown -->
                    <div id="library_section" class="mb-4">
                        <label for="library_book_id" class="form-label fw-bold">
                            <i class="fas fa-list me-1 text-success"></i> Select Library Book
                        </label>
                        <select class="form-select" id="library_book_id" name="library_book_id">
                            <option value="">Choose a book...</option>
                            {% for book in library_books %}
                            <option value="{{ book.id }}">{{ book.title }} by {{ book.author }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Custom Book Entry -->
                    <div id="custom_section" style="display: none;">
                        <div class="mb-4">
                            <label for="title" class="form-label fw-bold">
                                <i class="fas fa-book me-1 text-success"></i> Book Title
                            </label>
                            <input type="text" class="form-control" id="title" name="title"
                                   placeholder="Enter the book title">
                        </div>

                        <div class="mb-4">
                            <label for="author" class="form-label fw-bold">
                                <i class="fas fa-user-edit me-1 text-success"></i> Author
                            </label>
                            <input type="text" class="form-control" id="author" name="author"
                                   placeholder="Enter the author's name">
                        </div>

                        <div class="mb-4">
                            <label for="genre" class="form-label fw-bold">
                                <i class="fas fa-tag me-1 text-success"></i> Genre (Optional)
                            </label>
                            <select class="form-select" id="genre" name="genre">
                                <option value="">Select a genre...</option>
                                <option value="Fiction">Fiction</option>
                                <option value="Non-Fiction">Non-Fiction</option>
                                <option value="Science Fiction">Science Fiction</option>
                                <option value="Fantasy">Fantasy</option>
                                <option value="Mystery">Mystery</option>
                                <option value="Thriller">Thriller</option>
                                <option value="Romance">Romance</option>
                                <option value="Horror">Horror</option>
                                <option value="Biography">Biography</option>
                                <option value="History">History</option>
                                <option value="Self-Help">Self-Help</option>
                                <option value="Classic">Classic</option>
                                <option value="Dystopian">Dystopian</option>
                                <option value="Poetry">Poetry</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">
                            <i class="fas fa-bookmark me-1 text-success"></i> Add to...
                        </label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="status" id="status_wishlist" value="wishlist" checked>
                                <label class="form-check-label" for="status_wishlist">
                                    <span class="book-status wishlist">Want to Read</span>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="status" id="status_reading" value="reading">
                                <label class="form-check-label" for="status_reading">
                                    <span class="book-status reading">Currently Reading</span>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="status" id="status_bookshelf" value="bookshelf">
                                <label class="form-check-label" for="status_bookshelf">
                                    <span class="book-status completed">Add to Bookshelf</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn-tdc flex-grow-1">
                            <i class="fas fa-plus me-1"></i> Add Book
                        </button>
                        <a href="{{ url_for('reading_dashboard') }}" class="btn-tdc-outline">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function toggleBookSource() {
    const libraryRadio = document.getElementById('source_library');
    const librarySection = document.getElementById('library_section');
    const customSection = document.getElementById('custom_section');
    const librarySelect = document.getElementById('library_book_id');
    const titleInput = document.getElementById('title');
    const authorInput = document.getElementById('author');
    
    if (libraryRadio.checked) {
        librarySection.style.display = 'block';
        customSection.style.display = 'none';
        librarySelect.required = true;
        titleInput.required = false;
        authorInput.required = false;
    } else {
        librarySection.style.display = 'none';
        customSection.style.display = 'block';
        librarySelect.required = false;
        titleInput.required = true;
        authorInput.required = true;
    }
}
</script>
{% endblock %}
